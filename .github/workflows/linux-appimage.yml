name: Linux AppImage

on:
  pull_request:
  push:
    branches: [master, "linux-v*"]
    tags:
      - "linux-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Download appimagetool
        run: |
          curl -L --fail --retry 3 \
            -o "$GITHUB_WORKSPACE/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$GITHUB_WORKSPACE/appimagetool"

      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
        run: bash packaging/build-appimage.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Optimizer-Linux-x86_64
          path: dist/IP-Optimizer-Linux-x86_64.AppImage

      - name: Publish GitHub release for Linux version
        if: startsWith(github.ref, 'refs/tags/linux-v') || startsWith(github.ref, 'refs/heads/linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/IP-Optimizer-Linux-x86_64.AppImage" \
            --target "$GITHUB_SHA" \
            --title "Linux $GITHUB_REF_NAME" \
            --generate-notes

