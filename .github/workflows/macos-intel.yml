name: macOS Intel DMG

on:
  pull_request:
  push:
    branches: [master, "mac-v*"]
    tags:
      - "mac-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build macOS Intel app and DMG
        run: bash packaging/build-macos-app.sh

      - name: Verify Intel architecture and DMG
        run: |
          lipo -info dist/IPOptimizer.app/Contents/MacOS/IPOptimizer
          lipo -info dist/IPOptimizer.app/Contents/MacOS/IPOptimizer | grep -q "x86_64"
          test -s dist/IP-Optimizer-macOS-Intel.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Optimizer-macOS-Intel
          path: dist/IP-Optimizer-macOS-Intel.dmg
          if-no-files-found: error

      - name: Publish GitHub release for macOS Intel version
        if: startsWith(github.ref, 'refs/tags/mac-v') || startsWith(github.ref, 'refs/heads/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/IP-Optimizer-macOS-Intel.dmg" \
            --target "$GITHUB_SHA" \
            --title "macOS Intel $GITHUB_REF_NAME" \
            --generate-notes

